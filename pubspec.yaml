name: panaderia_liz
description: A cross-platform Point of Sale application for bakery management with authentication and role-based access.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0

  # State Management
  provider: ^6.0.0

  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^1.1.1
  shared_preferences: ^2.2.2
  path: ^1.8.3

  # Navigation & Routing
  go_router: ^12.0.0

  # Utilities
  intl: ^0.18.0
  uuid: ^4.0.0
  
  # Security
  pointycastle: ^3.7.0
  crypto: ^3.0.0
  
  # Additional features
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.0.0

  # Charts & Reporting
  fl_chart: ^0.65.0
  pdf: ^3.10.0
  path_provider: ^2.1.0
  file_saver: ^0.3.1
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  url_launcher: ^6.3.2
  
  # Image Handling
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  # Uncomment and add custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
